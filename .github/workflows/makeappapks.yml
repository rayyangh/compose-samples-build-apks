name: Build & Release All Sample APKs

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Build each app using its own directory's gradlew file
      - name: Build Jetchat
        run: |
          chmod +x Jetchat/gradlew
          cd Jetchat && ./gradlew assembleDebug

      - name: Build JetNews
        run: |
          chmod +x JetNews/gradlew
          cd JetNews && ./gradlew assembleDebug

      - name: Build Jetsnack
        run: |
          chmod +x Jetsnack/gradlew
          cd Jetsnack && ./gradlew assembleDebug

      - name: Build Jetcaster
        run: |
          chmod +x Jetcaster/gradlew
          cd Jetcaster && ./gradlew assembleDebug

      - name: Build JetLagged
        run: |
          chmod +x JetLagged/gradlew
          cd JetLagged && ./gradlew assembleDebug

      - name: Build Reply
        run: |
          chmod +x Reply/gradlew
          cd Reply && ./gradlew assembleDebug

      - name: Publish All APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: all-samples-v1.0
          name: Compose Samples (All Apps)
          body: |
            This release contains pre-built debug APKs for all Compose sample apps:
            - Jetchat
            - JetNews
            - Jetsnack
            - Jetcaster
            - JetLagged
            - Reply
          files: |
            Jetchat/app/build/outputs/apk/debug/*.apk
            JetNews/app/build/outputs/apk/debug/*.apk
            Jetsnack/app/build/outputs/apk/debug/*.apk
            Jetcaster/app/build/outputs/apk/debug/*.apk
            JetLagged/app/build/outputs/apk/debug/*.apk
            Reply/app/build/outputs/apk/debug/*.apk
