name: Build & Release All Sample APKs

on:
  workflow_dispatch: # Allows manual trigger via 'Run workflow' button

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All Sample APKs
        # Compiles Jetchat, Jetnews, Jetsnack, Jetcaster, JetLagged, and Reply simultaneously
        run: |
          ./gradlew :Jetchat:assembleDebug \
                    :JetNews:assembleDebug \
                    :Jetsnack:assembleDebug \
                    :Jetcaster:assembleDebug \
                    :JetLagged:assembleDebug \
                    :Reply:assembleDebug

      - name: Publish All APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: all-samples-v1.0
          name: Compose Samples (All Apps)
          body: |
            This release contains pre-built debug APKs for all Compose sample apps in this repository:
            - Jetchat
            - Jetnews
            - Jetsnack
            - Jetcaster
            - JetLagged
            - Reply
          files: |
            Jetchat/app/build/outputs/apk/debug/*.apk
            JetNews/app/build/outputs/apk/debug/*.apk
            Jetsnack/app/build/outputs/apk/debug/*.apk
            Jetcaster/app/build/outputs/apk/debug/*.apk
            JetLagged/app/build/outputs/apk/debug/*.apk
            Reply/app/build/outputs/apk/debug/*.apk
